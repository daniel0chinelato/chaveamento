<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Produtos | K.M.P.S</title>
    <meta name="description" content="Confira os produtos oficiais do K.M.P.S — bonés, camisetas e colecionáveis da comunidade de torneios de Age of Mythology.">
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070A0F;
            --panel-surface: #111115;
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-color: #d4af37;
            --text-main: #f0f0f0;
            --text-muted: #888899;
            --hover-color: #a13d3d;
            --hover-glow: rgba(161, 61, 61, 0.18);
            --footer-solid-bg: #1E1E1E;
            --title-color: #e04040;
            --title-size-xl: 3rem;
            --title-size-lg: 1.6rem;
            --title-size-md: 1.15rem;
            --title-size-sm: 0.85rem;
            --text-size-body: 0.95rem;
            --text-size-small: 0.8rem;
        }
        * { box-sizing: border-box; }
        html { overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hover-color); }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--title-color); font-weight: 600; margin-top: 0; letter-spacing: 2px; text-transform: uppercase; }
        .navbar {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center; padding: 9px 26px; gap: 14px;
            position: fixed; top: 28px; left: 50%; transform: translateX(-50%); z-index: 1000;
            flex-wrap: wrap; box-shadow: 0 4px 24px rgba(0,0,0,0.35); min-height: 56px; width: max-content; max-width: calc(100% - 40px);
        }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 8px 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease; font-weight: 600; font-size: 0.7rem; border-radius: 6px; font-family: 'Montserrat', sans-serif;
            text-decoration: none; display: inline-block;
        }
        .nav-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.06); }
        .nav-btn.active { color: #000; background-color: var(--accent-color); }
        .container { max-width: 1200px; margin: 0 auto; padding: 150px 20px 60px; }
        .page-title { text-align: center; font-size: var(--title-size-xl); letter-spacing: 6px; margin-bottom: 10px; }
        .page-sub { text-align: center; color: var(--text-muted); font-size: var(--text-size-body); max-width: 560px; margin: 0 auto 50px; line-height: 1.6; }
        .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        @media (max-width: 800px) { .products-grid { grid-template-columns: repeat(2, 1fr); } .page-title { font-size: 1.8rem; letter-spacing: 3px; } }
        .product-card { position: relative; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); background: linear-gradient(160deg,#161616,#0a0a0a); display: flex; align-items: center; justify-content: center; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .product-card:hover img { transform: scale(1.08); }
        .product-card-label { color: var(--text-muted); font-size: 0.7rem; text-align: center; padding: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .ver-mais-wrap { text-align: center; margin-top: 30px; }
        .ver-mais-wrap a { color: var(--hover-color); font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; text-decoration: none; }
        .ver-mais-wrap a:hover { text-decoration: underline; }
        .home-footer-solid-band { margin-top: 80px; background: var(--footer-solid-bg); padding: 40px 20px 30px; }
        .home-sites-footer { text-align: center; }
        .home-sites-footer-title { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
        .home-sites-footer-links { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }
        .home-sites-footer-links a { color: var(--accent-color); font-size: 0.75rem; letter-spacing: 1px; text-decoration: none; }
        .home-sites-footer-links a:hover { color: var(--hover-color); text-decoration: underline; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 4px; font-weight: 300; padding-bottom: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <a class="nav-btn" href="index.html">Início</a>
        <a class="nav-btn" href="torneios.html">Torneios</a>
        <a class="nav-btn" href="index.html#secaoAtualizacoes">Atualizações</a>
        <a class="nav-btn active" href="produtos.html">Nossos Produtos</a>
        <a class="nav-btn" href="index.html#secaoCanais">Canais</a>
    </div>

    <div class="container">
        <h1 class="page-title">Nossos Produtos</h1>
        <p class="page-sub">Produtos oficiais da comunidade K.M.P.S — bonés, camisetas e colecionáveis pra levar o clima do torneio pra fora da tela.</p>

        <div class="products-grid" id="produtosList"></div>
        <div class="ver-mais-wrap"><a href="#" id="produtosVerMaisLink" target="_blank" rel="noopener noreferrer">Ver mais +</a></div>
    </div>

    <div class="home-footer-solid-band">
        <div class="home-sites-footer">
            <div class="home-sites-footer-title">Acesse nossos sites</div>
            <div class="home-sites-footer-links" id="meusSitesList"></div>
        </div>
        <div class="footer">DESENVOLVIDO POR K.M.P.S</div>
    </div>

    <script>
        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str == null ? '' : String(str);
            return d.innerHTML;
        }
        // Nossos Produtos — troque pelas fotos e link da loja reais (mesmos dados do index.html, mantenha sincronizado).
        const produtosLoja = {
            linkVerMais: '#',
            itens: [
                { imagem: '', alt: 'Boné' },
                { imagem: '', alt: 'Camiseta branca' },
                { imagem: '', alt: 'Camiseta preta' },
                { imagem: '', alt: 'Boneco colecionável' },
            ]
        };
        function renderizarProdutos() {
            const lista = document.getElementById('produtosList');
            const linkVerMais = document.getElementById('produtosVerMaisLink');
            if (!lista) return;
            linkVerMais.href = produtosLoja.linkVerMais;
            lista.innerHTML = produtosLoja.itens.map(p => p.imagem
                ? `<div class="product-card"><img src="${p.imagem}" alt="${escapeHtml(p.alt)}"></div>`
                : `<div class="product-card"><span class="product-card-label">${escapeHtml(p.alt)}</span></div>`
            ).join('');
        }
        // Mesma lista de sites do rodapé do index.html — mantenha sincronizado se adicionar/remover algum.
        const meusSites = [
            { nome: 'Compêndio de Cartas', meta: 'album-carta.vercel.app', url: 'https://album-carta.vercel.app/' },
            { nome: 'Draft Overlay', meta: 'overlay-drafts.vercel.app', url: 'https://overlay-drafts.vercel.app/' },
            { nome: 'Aprendendo Age', meta: 'aprendendoage.com', url: 'https://aprendendoage.com/' },
        ];
        const INSTAGRAM_HANDLE = 'mdre.mandarecurso';
        function renderizarMeusSites() {
            const lista = document.getElementById('meusSitesList');
            if (!lista) return;
            const links = meusSites.map(t => `<a href="${t.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(t.meta)}</a>`);
            if (INSTAGRAM_HANDLE) links.push(`<a href="https://www.instagram.com/${INSTAGRAM_HANDLE}/" target="_blank" rel="noopener noreferrer">@${INSTAGRAM_HANDLE} (Instagram)</a>`);
            lista.innerHTML = links.join('');
        }
        window.onload = () => { renderizarProdutos(); renderizarMeusSites(); };
    </script>
</body>
</html>
