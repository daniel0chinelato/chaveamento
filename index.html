            const linkLimpo = window.location.origin + window.location.pathname;
            navigator.clipboard.writeText(linkLimpo).then(() => {
                const textoOriginal = btn.innerText; btn.innerText = "Copiado!"; btn.style.opacity = "1"; btn.style.color = "var(--accent-color)";

        const listaDeuses = ["Zeus", "Hades", "Poseidon", "Deméter", "Tsukuyomi", "Amaterasu", "Susanoo", "Fuxi", "Nuwa", "Shennong", "Thor", "Odin", "Loki", "Freyr", "Ísis", "Rá", "Set", "Cronos", "Gaia", "Urano", "Quetzalcoatl", "Tezcatlipoca", "Huitzilopochtli"];
        
        const mapaImagens = {
            "Acrópole": "acropole.jpg", "Anatólia": "anatolia.jpg", "Coração de Tenochtitlán": "coracao.jpg",
            "Elísio": "elisio.jpg", "Estepe": "estepe.jpg", "Floresta das Trevas": "floresta das trevas.jpg",
            "Lago Fantasma": "lago fantasma.jpg", "Mediterrâneo": "mediterraneo.jpg", "Muspelheim": "muspelheim.jpg",
            "Oásis": "oasis.jpg", "Pântano": "pantano.jpg", "Savana": "savana.jpg", "Senjogahara": "senjogahara.jpg",

        };
        const listaMapas = Object.keys(mapaImagens).sort();

        function getGodIconPath(nome) { if(!nome) return ''; let safeName = nome.toLowerCase().replace('é', 'e').replace('í', 'i').replace('á', 'a'); return safeName + '_icon.png'; }

        function getMapHintPath(nomeDoMapa) {
            if(nomeDoMapa === "Coração de Tenochtitlán" || nomeDoMapa === "O Coração de Tenochtitlán") return "hint_coracao.png";
            if(nomeDoMapa === "Lago Fantasma") return "hint_fantasma.png";
            let safeName = nomeDoMapa.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            return "hint_" + safeName + ".png";
        }

        function initGodsTable() {
            const tbody = document.getElementById('godsTable');
            if(!tbody) return;
            tbody.innerHTML = '';
            listaDeuses.forEach(deus => {
                tbody.innerHTML += `
                <tr class="god-row" data-v="0" data-wr="0" data-j="0" data-b="0">
                    <td style="text-align:left"><div style="display:flex; align-items:center; gap:8px;"><img src="${getGodIconPath(deus)}" class="god-icon" onerror="this.style.display='none'"><span>${deus}</span></div></td>
                    <td><input type="number" value="0" class="stat-input"></td>
                    <td><input type="number" value="0" class="stat-input"></td>
                    <td class="g-d">0</td>
                    <td class="g-b" style="color:var(--danger-color); font-weight:bold;">0</td>
                    <td class="g-w" style="font-weight:bold; color:var(--accent-color);">0%</td>
                </tr>`;
            });
        }

        function renderizarGodGrid() {
            const grid = document.getElementById('godGrid'); grid.innerHTML = '';
            listaDeuses.forEach(deus => { grid.innerHTML += `<img src="${getGodIconPath(deus)}" class="god-grid-item" title="${deus}" onclick="selecionarDeus('${deus}', '${getGodIconPath(deus)}')">`; });
        }
        
        function renderizarFiltrosDeMapas() {
            let selectPageMain = document.getElementById('mapFilter');
            if(selectPageMain) listaMapas.forEach(m => { selectPageMain.innerHTML += `<option value="${m}">${m}</option>`; });

            const selector = document.getElementById('mapThumbSelector');
            if(!selector) return;
            selector.innerHTML = '';
            listaMapas.forEach(m => {
                const img = mapaImagens[m] || 'header.png';
                selector.innerHTML += `<div class="map-thumb" onclick="atualizarPainelMapas('${m}')" id="thumb-${m.replace(/\s+/g, '-')}" style="background-image: url('${img}')"><span>${m}</span></div>`;
            });
        }

        let godTargetElement = null;
        function abrirModalDeuses(el) { if(document.body.classList.contains('is-viewer')) return; godTargetElement = el; document.getElementById('godModal').style.display = 'flex'; }
        function fecharModalDeuses() { document.getElementById('godModal').style.display = 'none'; }
        
        function selecionarDeus(nome, imgPath) {
            if(godTargetElement) { godTargetElement.dataset.god = nome; godTargetElement.setAttribute('data-god', nome); godTargetElement.style.backgroundImage = `url('${imgPath}')`; atualizarTodosOsGods(); atualizarPainelMapas(); }
            fecharModalDeuses();
        }
        function removerDeusSelecionado() {
            if(godTargetElement) { godTargetElement.dataset.god = ""; godTargetElement.setAttribute('data-god', ""); godTargetElement.style.backgroundImage = "none"; atualizarTodosOsGods(); atualizarPainelMapas(); }
            fecharModalDeuses();
        }

        function atualizarMapas(sel) {
            Array.from(sel.options).forEach(opt => {
                if(opt.value === sel.value) opt.setAttribute('selected', 'selected');
                else opt.removeAttribute('selected');
            });
            atualizarTodosOsGods(); atualizarPainelMapas(); saveTournament();
        }

        let mapaAtivoGlobal = "Anatólia";
        let mostrandoDicas = false;

        function toggleDicas() {
            const uiContent = document.getElementById('mainMapUI');
            const hintContainer = document.getElementById('hintContainer');
            const mapBg = document.getElementById('immersiveMapBg');
            
            mostrandoDicas = !mostrandoDicas;
            
            if(mostrandoDicas) {
                uiContent.style.opacity = '0';
                uiContent.style.pointerEvents = 'none';
                hintContainer.classList.add('active');
                mapBg.style.backgroundImage = `url('${getMapHintPath(mapaAtivoGlobal)}')`;
                document.querySelector('.immersive-overlay').style.opacity = '0';
            } else {
                uiContent.style.opacity = '1';
                uiContent.style.pointerEvents = 'auto';
                hintContainer.classList.remove('active');
                mapBg.style.backgroundImage = `url('${mapaImagens[mapaAtivoGlobal]}')`;
                document.querySelector('.immersive-overlay').style.opacity = '1';
            }
        }

        function atualizarPainelMapas(mapaEscolhido = mapaAtivoGlobal) {
            mapaAtivoGlobal = mapaEscolhido;
            
            if(mostrandoDicas) toggleDicas(); 

            document.querySelectorAll('.map-thumb').forEach(t => t.classList.remove('active'));
            let activeThumb = document.getElementById('thumb-' + mapaEscolhido.replace(/\s+/g, '-'));
            if(activeThumb) {
                activeThumb.classList.add('active');
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            let bgImg = mapaImagens[mapaEscolhido] || 'header.png';
            let container = document.getElementById('immersiveMapBg');
            if(container) container.style.backgroundImage = `url('${bgImg}')`;
            
            let titulo = document.getElementById('mapaDestaqueTitulo');
            if(titulo) titulo.innerText = mapaEscolhido;

            let godStats = {};
            listaDeuses.forEach(g => godStats[g] = {j: 0, v: 0, d: 0, topPlayers: {}});

            document.querySelectorAll('.win-toggle').forEach(toggle => {
                let wrapper = toggle.closest('.god-slot-wrapper');
                let btn = wrapper.querySelector('.god-select-btn:not(.ban-slot)');
                if(!btn) return;
                let g = btn.dataset.god;
                if(!g) return;

                let matchCard = toggle.closest('.match-card') || toggle.closest('.b-match');
                let gameIdx = toggle.dataset.game;
                let mapSelect = matchCard.querySelector(`.map-select[data-game="${gameIdx}"]`);
                let gameMap = mapSelect ? mapSelect.value : "";

                if (gameMap !== mapaEscolhido) return;

                const allTogglesThisGame = matchCard.querySelectorAll(`.win-toggle[data-game="${gameIdx}"]`);
                let gameResolved = false; let thisWon = toggle.classList.contains('is-winner');
                
                allTogglesThisGame.forEach(t => { if(t.classList.contains('is-winner')) gameResolved = true; });

                if(gameResolved) {
                    godStats[g].j++;
                    if(thisWon) {
                        godStats[g].v++;
                        let playerName = "TBD";
                        let bPlayer = toggle.closest('.b-player');
                        if (bPlayer) {
                            let pNameEl = bPlayer.querySelector('.p-name');
                            if(pNameEl) playerName = pNameEl.innerText.trim();
                        } else {
                            let mPlayer = toggle.closest('.match-player');
                            if (mPlayer) {
                                let firstDiv = mPlayer.querySelector('div');
                                if(firstDiv) playerName = firstDiv.innerText.trim();
                            }
                        }

                        if(playerName !== "TBD" && playerName !== "BYE" && !playerName.startsWith("Perd.") && !playerName.startsWith("Venc.")) {
                            godStats[g].topPlayers[playerName] = (godStats[g].topPlayers[playerName] || 0) + 1;
                        }
                    }
                    else godStats[g].d++;
                }
            });

            let godsPlayed = Object.keys(godStats).filter(g => godStats[g].j > 0);
            godsPlayed.sort((a, b) => {
                let wrA = godStats[a].v / godStats[a].j;
                let wrB = godStats[b].v / godStats[b].j;
                if(wrB !== wrA) return wrB - wrA;
                return godStats[b].j - godStats[a].j;
            });

            let totalJogos = godsPlayed.reduce((acc, g) => acc + godStats[g].j, 0) / 2;
            let elTotal = document.getElementById('mapTotalJogos');
            if(elTotal) elTotal.innerText = Math.floor(totalJogos);

            let podiumHtml = '';
            let othersHtml = '';

            if(godsPlayed.length === 0) {
                podiumHtml = `<div style="text-align:right; width:100%; padding: 40px; color:#aaa; font-size:1.2rem; font-style:italic;">Aguardando partidas...</div>`;
            } else {
                function gerarCardPodio(godName, pos, tierClass) {
                    let s = godStats[godName];
                    let wr = ((s.v / s.j) * 100).toFixed(1);
                    let winPct = (s.v / s.j) * 100;
                    let lossPct = (s.d / s.j) * 100;
                    let titlePos = pos === 1 ? '1º' : (pos === 2 ? '2º' : '3º');

                    let playersArr = Object.keys(s.topPlayers).map(p => ({name: p, wins: s.topPlayers[p]}));
                    playersArr.sort((a,b) => b.wins - a.wins);
                    let topPlayerHtml = playersArr.length > 0 
                        ? playersArr.slice(0,2).map(p => `<div class="mvp-player">${p.name} <span>(${p.wins}V)</span></div>`).join('') 
                        : `<div class="mvp-player" style="color:#888;">Nenhum</div>`;

                    return `
                    <div class="podium-item ${tierClass}" onclick="this.classList.toggle('show-mvp')" title="Clique para ver os Especialistas">
                        <div class="avatar-wrapper">
                            <img src="${getGodIconPath(godName)}" alt="${godName}">
                            <div class="mvp-overlay">
                                <div class="mvp-title">Top Players</div>
                                ${topPlayerHtml}
                            </div>
                            <div class="podium-rank">${titlePos}</div>
                        </div>
                        <div class="podium-stats-box">
                            <div class="podium-name">${godName}</div>
                            <div style="font-size:0.65rem; color:#aaa; font-weight:bold;">${s.j} Jogos</div>
                            <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold; margin-top:4px; padding:0 2px;">
                                <span style="color:#4ade80;">${s.v}V</span>
                                <span style="color:var(--danger-color);">${s.d}D</span>
                            </div>
                            <div class="win-bar-container">
                                <div class="win-bar-fill" style="width: ${winPct}%;"></div>
                                <div class="loss-bar-fill" style="width: ${lossPct}%;"></div>
                            </div>
                            <div style="font-size:1rem; font-weight:bold; color:var(--accent-color); margin-top:4px;">${wr}%</div>
                        </div>
                    </div>`;
                }

                let p1 = godsPlayed[0] ? gerarCardPodio(godsPlayed[0], 1, 'gold') : '';
                let p2 = godsPlayed[1] ? gerarCardPodio(godsPlayed[1], 2, 'silver') : '';
                let p3 = godsPlayed[2] ? gerarCardPodio(godsPlayed[2], 3, 'bronze') : '';

                podiumHtml = `<div class="podium-wrapper">${p2}${p1}${p3}</div>`;

                for(let i = 3; i < godsPlayed.length; i++) {
                    let g = godsPlayed[i];
                    let wr = ((godStats[g].v / godStats[g].j) * 100).toFixed(1);
                    othersHtml += `
                    <div class="mini-stat-card">
                        <span class="pos">${i+1}º</span>
                        <img src="${getGodIconPath(g)}">
                        <span style="color:#fff; font-size:0.75rem; font-weight:bold;">${g}</span>
                        <span class="wr">${wr}%</span>
                    </div>`;
                }
            }
            
            document.getElementById('podiumArea').innerHTML = podiumHtml;
            document.getElementById('otherGodsArea').innerHTML = othersHtml;
        }

        let draggedPlayerRow = null;
        function dragPlayer(e) { if(document.body.classList.contains('is-viewer')) return; draggedPlayerRow = e.target; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => draggedPlayerRow.classList.add('dragging'), 0); }
        function allowDropPlayer(e) { e.preventDefault(); const tr = e.target.closest('tr'); if (tr && tr !== draggedPlayerRow && tr.parentNode.id.startsWith('tbody-grupo')) { const bounding = tr.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2); if (e.clientY - offset > 0) tr.style.borderBottom = "2px solid var(--accent-color)"; else tr.style.borderTop = "2px solid var(--accent-color)"; } }
        function dropPlayer(e) {
            e.preventDefault(); if (!draggedPlayerRow) return; draggedPlayerRow.classList.remove('dragging');
            document.querySelectorAll('#groupsDisplay tr').forEach(tr => { tr.style.borderTop = ""; tr.style.borderBottom = ""; });
            const targetTbody = e.target.closest('tbody'); const targetTr = e.target.closest('tr');
            if (targetTr && targetTr !== draggedPlayerRow) {
                const bounding = targetTr.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                if (e.clientY - offset > 0) targetTr.after(draggedPlayerRow); else targetTr.before(draggedPlayerRow);
            } else if (targetTbody && targetTbody.id.startsWith('tbody-grupo')) { targetTbody.appendChild(draggedPlayerRow); }
            reprocessarGruposAposDrag();
        }
        document.addEventListener('dragend', () => { if(draggedPlayerRow) draggedPlayerRow.classList.remove('dragging'); document.querySelectorAll('#groupsDisplay tr').forEach(tr => { tr.style.borderTop = ""; tr.style.borderBottom = ""; }); });

        function saveCurrentMatchesState() {
            let matchState = {};
            document.querySelectorAll('.match-card').forEach(card => {
                let p1 = card.dataset.p1, p2 = card.dataset.p2, streams = card.getAttribute('data-streams') || "[]";
                let maps = []; card.querySelectorAll('.map-select').forEach(sel => maps.push(sel.value));
                let bansP1 = []; card.querySelectorAll(`.match-card .ban-slot[class*="-p1"], .b-match .ban-slot[class*="-p1"]`).forEach(b => bansP1.push(b.getAttribute('data-god') || ""));
                let bansP2 = []; card.querySelectorAll(`.match-card .ban-slot[class*="-p2"], .b-match .ban-slot[class*="-p2"]`).forEach(b => bansP2.push(b.getAttribute('data-god') || ""));
                let gState = []; const playersDivs = card.querySelectorAll('.match-player');
                if(playersDivs.length === 2) {
                    const w1 = playersDivs[0].querySelectorAll('.pick-slot-wrapper, .god-slot-wrapper:not(.ban-group .god-slot-wrapper)');
                    const w2 = playersDivs[1].querySelectorAll('.pick-slot-wrapper, .god-slot-wrapper:not(.ban-group .god-slot-wrapper)');
                    for(let g=0; g<3; g++) {
                        let god1 = w1[g]?.querySelector('.god-select-btn')?.getAttribute('data-god') || "";
                        let win1 = w1[g]?.querySelector('.win-toggle')?.classList.contains('is-winner') || false;
                        let god2 = w2[g]?.querySelector('.god-select-btn')?.getAttribute('data-god') || "";
                        let win2 = w2[g]?.querySelector('.win-toggle')?.classList.contains('is-winner') || false;
                        gState.push({ god1, win1, god2, win2 });
                    }
                }
                matchState[`${p1}|${p2}`] = { streams, gState, maps, bansP1, bansP2, reversed: false };
                matchState[`${p2}|${p1}`] = { streams, gState, maps, bansP1, bansP2, reversed: true };
            });
            return matchState;
        }

        function reprocessarGruposAposDrag() {
            let state = saveCurrentMatchesState(); let novosGrupos = [];
            document.querySelectorAll('[id^="tbody-grupo-"]').forEach(tbody => {
                let grupo = []; tbody.querySelectorAll('tr').forEach(tr => { if(tr.dataset.player) grupo.push({ nome: tr.dataset.player, seed: tr.classList.contains('seed-row') }); });
                novosGrupos.push(grupo);
            });
            gerarConfrontosGrupos(novosGrupos, state); document.querySelectorAll('.match-card').forEach(card => calcularPlacarGlobal(card, false)); calcularEloGeral(); saveTournament();
        }

        function toggleVitoria(btn) {
            if(document.body.classList.contains('is-viewer')) return;
            const gameIdx = btn.dataset.game, card = btn.closest('.match-card') || btn.closest('.b-match');
            const allTogglesForGame = card.querySelectorAll(`.win-toggle[data-game="${gameIdx}"]`);
            const wasActive = btn.classList.contains('is-winner');
            allTogglesForGame.forEach(t => t.classList.remove('is-winner'));
            if(!wasActive) { btn.classList.add('is-winner'); }
            calcularPlacarGlobal(card, true);
        }

        function calcularPlacarGlobal(card, shouldSave = false) {
            const p1Wins = card.querySelectorAll(`.win-toggle[data-player="1"].is-winner`).length;
            const p2Wins = card.querySelectorAll(`.win-toggle[data-player="2"].is-winner`).length;
            const score1 = card.querySelector('.score-p1'), score2 = card.querySelector('.score-p2');
            if(score1) { score1.value = p1Wins; score1.setAttribute('value', p1Wins); }
            if(score2) { score2.value = p2Wins; score2.setAttribute('value', p2Wins); }
            verificarBloqueioBoX(card, p1Wins, p2Wins);
            const groupIdx = card.dataset.group;
            if(groupIdx !== undefined) atualizarEstatisticasDoGrupo(groupIdx);
            atualizarTodosOsGods(); atualizarPainelMapas();
            if(shouldSave) { calcularEloGeral(); saveTournament(); }
        }

        function verificarBloqueioBoX(card, p1Wins, p2Wins) {
            const totalGames = card.querySelectorAll(`.win-toggle[data-player="1"]`).length;
            if(totalGames === 0) return;
            const majority = Math.ceil(totalGames / 2); const isMatchOver = (p1Wins >= majority || p2Wins >= majority);
            for(let i=0; i < totalGames; i++) {
                const toggles = card.querySelectorAll(`.win-toggle[data-game="${i}"]`);
                const isGameResolved = (toggles[0]?.classList.contains('is-winner') || toggles[1]?.classList.contains('is-winner'));
                const matchIdBase = card.querySelector('.win-toggle').dataset.match;
                const godSlots = card.querySelectorAll(`.game${i}-slot.${matchIdBase}-slot`);
                if(isMatchOver && !isGameResolved) {
                    godSlots.forEach(slot => { slot.classList.add('locked'); slot.dataset.god = ""; slot.setAttribute('data-god', ""); slot.style.backgroundImage = "none"; });
                    toggles.forEach(t => t.style.display = 'none');
                } else {
                    godSlots.forEach(slot => slot.classList.remove('locked'));
                    toggles.forEach(t => { if(!document.body.classList.contains('is-viewer')) t.style.display = 'block'; });
                }
            }
        }

        function atualizarTodosOsGods() {
            let godStats = {}; listaDeuses.forEach(g => godStats[g] = {j: 0, v: 0, d: 0, b: 0});
            let mapFilterElement = document.getElementById('mapFilter');
            let mapFilter = mapFilterElement ? mapFilterElement.value : 'ALL';

            document.querySelectorAll('.ban-slot').forEach(banSlot => {
                let g = banSlot.dataset.god;
                if(g && godStats[g]) { if(mapFilter === 'ALL') { godStats[g].b++; } }
            });

            document.querySelectorAll('.win-toggle').forEach(toggle => {
                let wrapper = toggle.closest('.god-slot-wrapper');
                let btn = wrapper.querySelector('.god-select-btn:not(.ban-slot)');
                if(!btn) return; let g = btn.dataset.god; if(!g) return;

                let matchCard = toggle.closest('.match-card') || toggle.closest('.b-match');
                let gameIdx = toggle.dataset.game;
                let mapSelect = matchCard.querySelector(`.map-select[data-game="${gameIdx}"]`);
                let gameMap = mapSelect ? mapSelect.value : "";

                if(mapFilter !== 'ALL' && gameMap !== mapFilter) return; 

                const allTogglesThisGame = matchCard.querySelectorAll(`.win-toggle[data-game="${gameIdx}"]`);
                let gameResolved = false; let thisWon = toggle.classList.contains('is-winner'); let oppWon = false;
                
                allTogglesThisGame.forEach(t => { if(t.classList.contains('is-winner')) gameResolved = true; if(t !== toggle && t.classList.contains('is-winner')) oppWon = true; });
                if(gameResolved) { godStats[g].j++; if(thisWon) godStats[g].v++; if(oppWon) godStats[g].d++; }
            });

            const tbody = document.getElementById('godsTable'); if(!tbody) return;
            const rows = Array.from(tbody.querySelectorAll('.god-row'));
            
            rows.forEach(row => {
                const godName = row.querySelector('td span').innerText.trim();
                const stats = godStats[godName] || {j:0, v:0, d:0, b:0};
                const statInputs = row.querySelectorAll('.stat-input');
                statInputs[0].value = stats.j; statInputs[0].setAttribute('value', stats.j);
                statInputs[1].value = stats.v; statInputs[1].setAttribute('value', stats.v);
                row.querySelector('.g-d').innerText = stats.d; row.querySelector('.g-b').innerText = stats.b;
                const wr = stats.j > 0 ? (stats.v / stats.j) * 100 : 0;
                row.querySelector('.g-w').innerText = wr.toFixed(1) + '%';
                row.dataset.j = stats.j; row.dataset.v = stats.v; row.dataset.wr = wr;
            });
            rows.sort((a, b) => { const vA = parseInt(a.dataset.v), vB = parseInt(b.dataset.v), wrA = parseFloat(a.dataset.wr), wrB = parseFloat(b.dataset.wr), jA = parseInt(a.dataset.j), jB = parseInt(b.dataset.j); if (vB !== vA) return vB - vA; if (wrB !== wrA) return wrB - wrA; return jB - jA; });
            rows.forEach(r => tbody.appendChild(r));
        }

        function addStreamLink(btn) {
            const card = btn.closest('.match-card') || btn.closest('.b-match');
            let streams = []; try { streams = JSON.parse(card.getAttribute('data-streams') || "[]"); } catch(e) {}
            const input = prompt(`Adicionar link de transmissão (Twitch, YouTube).\nPara apagar tudo, digite "limpar".`);
            if(input === null) return; 
            if(input.trim().toLowerCase() === 'limpar') streams = [];
            else if(input.trim() !== "") streams.push(input.trim());
            card.setAttribute('data-streams', JSON.stringify(streams));
            renderStreamLinks(); saveTournament(); 
        }

        function renderStreamLinks() {
            document.querySelectorAll('.match-card, .b-match').forEach(card => {
                const streamData = card.getAttribute('data-streams'), controls = card.querySelector('.stream-controls');
                if(!controls) return;
                const addBtn = controls.querySelector('.add-stream-btn'); controls.innerHTML = ''; if(addBtn) controls.appendChild(addBtn);
