<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era das Tavernas | Torneio Ao Vivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #030304;
            --panel-bg: #0a0a0d;
            --panel-surface: #111115;
            --border-color: rgba(255, 255, 255, 0.05);
            --border-highlight: rgba(196, 161, 83, 0.3);
            --accent-color: #d4af37; 
            --accent-glow: rgba(212, 175, 55, 0.15);
            --text-main: #f0f0f0;
            --text-muted: #888899;
            --danger-color: #a83232;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, var(--panel-surface) 0%, transparent 70%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0; line-height: 1.6;
            min-height: 100vh;
        }

        h2, h3, h4 { font-family: 'Cinzel', serif; color: var(--accent-color); font-weight: 600; margin-top: 0; letter-spacing: 2px; text-transform: uppercase; }

        .header-container { width: 100%; margin: 20px 0 40px 0; display: flex; justify-content: center; align-items: center; }
        .header-image { width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 12px; filter: drop-shadow(0 8px 25px var(--accent-glow)); }

        .navbar {
            background-color: rgba(10, 10, 13, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: center; align-items: center; padding: 15px; gap: 20px; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 10px 24px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease; font-weight: 600; font-size: 0.75rem; border-radius: 6px; font-family: 'Montserrat', sans-serif;
        }
        .nav-btn.active { background-color: var(--accent-color); color: #000; border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }
        
        .btn-save { border-color: #2a7a48; color: #4ade80; display: flex; align-items: center; gap: 8px;}
        .btn-save:hover { background-color: #2a7a48; color: #fff; }
        .btn-reset { border-color: var(--danger-color); color: var(--danger-color); }
        
        /* Botão minimalista para copiar link */
        .btn-copy { border: none; opacity: 0.5; padding: 10px 15px; }
        .btn-copy:hover { opacity: 1; color: var(--text-main); }

        .loader { display: none; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1600px; margin: 0 auto; padding: 0 20px 60px 20px; }
        .page { display: none; flex-direction: column; gap: 40px; }
        .page.active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel {
            background-color: var(--panel-bg); border: 1px solid var(--border-color); padding: 35px; border-radius: 12px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.02); position: relative; overflow: hidden;
        }
        .panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--border-highlight), transparent); }

        .content-with-sidebar { display: flex; flex-direction: column; gap: 30px; }
        @media (min-width: 1024px) {
            .content-with-sidebar { flex-direction: row; align-items: flex-start; }
            .content-main { flex: 1; min-width: 0; }
            .content-sidebar { width: 440px; flex-shrink: 0; }
        }

        .panel-discreet { background-color: rgba(255,255,255,0.01); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; overflow-x: auto; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr 250px; gap: 30px; }
        
        textarea, select, .setup-grid input {
            width: 100%; background-color: var(--panel-surface); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 15px; border-radius: 8px;
            box-sizing: border-box; font-family: 'Montserrat', sans-serif; font-size: 0.9rem;
        }

        button.action-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), transparent); color: var(--accent-color); border: 1px solid var(--accent-color);
            padding: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; border-radius: 6px; font-weight: 600; font-size: 0.8rem;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
        th { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; padding: 10px 15px; border-bottom: 1px solid var(--border-color); }
        td { padding: 12px 15px; background-color: var(--panel-surface); text-align: center; font-size: 0.9rem; }
        .seed-row td:first-child { box-shadow: inset 3px 0 0 var(--accent-color); }
        
        .match-card { background: var(--panel-surface); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
        .match-player { flex: 1; text-align: center; font-weight: 600; }
        
        .god-select-btn { width: 26px; height: 26px; border-radius: 4px; border: 1px dashed var(--text-muted); background-color: #050505; cursor: pointer; display: inline-block; margin-top: 8px; background-size: cover; background-position: center; }
        
        .match-score { display: flex; align-items: center; gap: 15px; background: #000; padding: 5px 15px; border-radius: 6px; border: 1px solid var(--border-color); }
        .match-score input { width: 30px; background: transparent; border: none; color: var(--accent-color); text-align: center; font-size: 1.5rem; font-weight: 700; font-family: 'Cinzel', serif; }

        .bracket-container { display: flex; gap: 40px; overflow-x: auto; padding: 20px 10px; }
        .bracket-round { display: flex; flex-direction: column; justify-content: space-around; min-width: 260px; }
        .b-match { background: var(--panel-surface); border: 1px solid var(--border-color); margin: 15px 0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .b-player { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .b-player.winner-slot { background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), transparent); color: var(--accent-color); border-left: 3px solid var(--accent-color); }
        .b-player.loser-slot { opacity: 0.3; background-color: #050505; }
        .score-input { width: 30px; padding: 2px; background: transparent; border: none; color: var(--text-main); text-align: right; font-weight: 700; }
        .btn-advance { background: transparent; border: 1px solid var(--border-highlight); color: var(--text-muted); border-radius: 4px; padding: 4px 10px; font-weight: 600; font-size: 0.65rem; text-transform: uppercase; margin-left: 10px; cursor: pointer; }

        /* --- MODO VISUALIZAÇÃO (ESPECTADOR) --- */
        body.is-viewer .admin-only, 
        body.is-viewer .btn-advance, 
        body.is-viewer .btn-promote { display: none !important; }
        body.is-viewer input, 
        body.is-viewer [contenteditable="true"] { pointer-events: none !important; border: none !important; outline: none !important; }
        body.is-viewer .god-select-btn { cursor: default !important; }
        body.is-viewer .navbar .btn-save, 
        body.is-viewer .navbar .btn-reset,
        body.is-viewer .navbar .btn-copy { display: none !important; }

        .stat-input { width: 45px; padding: 4px; text-align: center; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px;}
        .god-icon { width: 24px; height: 24px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-box { background: var(--panel-surface); border: 1px solid var(--accent-color); padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; }
        .god-grid-item { width: 45px; height: 45px; cursor: pointer; border-radius: 6px; border: 2px solid transparent; transition: 0.2s; }
        .god-grid-item:hover { border-color: var(--accent-color); transform: scale(1.1); }
        .footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 4px; }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('page-main', this)">Início</button>
        <button class="nav-btn" onclick="switchTab('page-matches', this)">Grupos</button>
        <div style="width: 1px; height: 30px; background: var(--border-color); margin: 0 10px;"></div>
        <button class="nav-btn btn-save admin-only" onclick="saveTournament()">Salvar <span class="loader" id="saveLoader"></span></button>
        <button class="nav-btn btn-reset admin-only" onclick="resetTournament()">Reset</button>
        <button class="nav-btn btn-copy admin-only" onclick="copiarLinkPublico(this)" title="Copiar link bloqueado para o público">🔗 Link Público</button>
    </div>

    <div id="page-main" class="container page active">
        <div class="header-container"><img src="header.png" alt="Header" class="header-image"></div>

        <div class="panel admin-only">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
                <h2 style="margin:0;">Configuração</h2>
                <button class="nav-btn" style="padding: 6px 16px; font-size: 0.7rem;" onclick="toggleSetup()" id="btnToggleSetup">Recolher</button>
            </div>
            <div class="setup-grid" id="setupContent">
                <div><label>Seeds</label><textarea id="seedsInput" rows="5"></textarea></div>
                <div><label>Regulares</label><textarea id="regularsInput" rows="5"></textarea></div>
                <div>
                    <label>Grupos</label>
                    <select id="numGroups"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select>
                    <button class="action-btn" style="margin-top:25px; width:100%;" onclick="gerarTorneio()">Gerar</button>
                </div>
            </div>
        </div>

        <div id="groupsSection" style="display:none;">
            <h2>Tabelas de Grupos</h2>
            <div class="groups-grid" id="groupsDisplay"></div>
        </div>

        <div class="content-with-sidebar">
            <div class="content-main">
                <div class="panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap:15px; margin-bottom: 20px;">
                        <h2 style="margin:0;">Mata-Mata</h2>
                        <div class="admin-only" style="display:flex; gap:15px;">
                            <select id="bracketSize" style="width:100px; margin:0;"><option value="4">Top 4</option><option value="8" selected>Top 8</option><option value="16">Top 16</option></select>
                            <button class="nav-btn" style="padding:8px 16px;" onclick="puxarPromovidos()">Importar</button>
                        </div>
                    </div>
                    <div class="bracket-container" id="bracketDisplay"></div>
                </div>
            </div>

            <div class="content-sidebar">
                <div class="panel-discreet">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; font-size: 1rem; color: var(--text-muted);">Estatísticas Gods</h3>
                        <button class="nav-btn" style="padding: 4px 12px; font-size: 0.65rem;" onclick="toggleStats()" id="btnToggleStats">Mostrar</button>
                    </div>
                    <div id="statsContent" style="display: none; margin-top: 15px;">
                        <table>
                            <thead><tr><th style="text-align:left;">God</th><th>J</th><th>V</th><th>WR</th></tr></thead>
                            <tbody id="godsTable">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">DESENVOLVIDO POR [CAOK] PAIN</div>
    </div>

    <div id="page-matches" class="container page">
        <h1>Confrontos</h1>
        <div id="matchesGroupsContainer"></div>
        <div class="footer">DESENVOLVIDO POR [CAOK] PAIN</div>
    </div>

    <div id="godModal" class="modal-overlay" onclick="fecharModalDeuses()"><div class="modal-box" onclick="event.stopPropagation()"><div id="godGrid" style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;"></div></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWzuxeowvBaFL9eaqOMqOqCyqQSYb6qls",
            authDomain: "chaveamento-9e13f.firebaseapp.com",
            databaseURL: "https://chaveamento-9e13f-default-rtdb.firebaseio.com",
            projectId: "chaveamento-9e13f",
            storageBucket: "chaveamento-9e13f.firebasestorage.app",
            messagingSenderId: "650676573824",
            appId: "1:650676573824:web:0ffafe444b3694df28b865"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- LÓGICA DE VISUALIZAÇÃO E BOTÃO COPIAR ---
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('view')) {
            document.body.classList.add('is-viewer');
        }

        function copiarLinkPublico(btn) {
            const url = window.location.origin + window.location.pathname + '?view';
            navigator.clipboard.writeText(url).then(() => {
                const textoOriginal = btn.innerText;
                btn.innerText = "Copiado!";
                btn.style.opacity = "1";
                btn.style.color = "var(--accent-color)";
                setTimeout(() => { 
                    btn.innerText = textoOriginal; 
                    btn.style.opacity = "0.5";
                    btn.style.color = "";
                }, 2000);
            });
        }

        const listaDeuses = ["Zeus", "Hades", "Poseidon", "Deméter", "Tsukuyomi", "Amaterasu", "Susanoo", "Fuxi", "Nuwa", "Shennong", "Thor", "Odin", "Loki", "Freyr", "Ísis", "Rá", "Set", "Cronos", "Gaia", "Urano", "Quetzalcoatl", "Tezcatlipoca", "Huitzilopochtli"];

        function renderizarGodGrid() {
            const grid = document.getElementById('godGrid');
            grid.innerHTML = '';
            listaDeuses.forEach(deus => {
                let safe = deus.toLowerCase().replace('é', 'e').replace('í', 'i').replace('á', 'a');
                grid.innerHTML += `<img src="${safe}_icon.png" class="god-grid-item" onclick="selecionarDeus('${deus}', '${safe}_icon.png')">`;
            });
        }

        let godTargetElement = null;
        function abrirModalDeuses(el) { if(document.body.classList.contains('is-viewer')) return; godTargetElement = el; document.getElementById('godModal').style.display = 'flex'; }
        function fecharModalDeuses() { document.getElementById('godModal').style.display = 'none'; }
        function selecionarDeus(nome, img) { if(godTargetElement) { godTargetElement.dataset.god = nome; godTargetElement.setAttribute('data-god', nome); godTargetElement.style.backgroundImage = `url('${img}')`; atualizarTodosOsGods(); } fecharModalDeuses(); }

        function switchTab(id, btn) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.navbar .nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        function toggleSetup() { let s = document.getElementById('setupContent'); s.style.display = s.style.display === 'none' ? 'grid' : 'none'; }
        function toggleStats() { let s = document.getElementById('statsContent'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; }

        function gerarTorneio() {
            const seeds = document.getElementById('seedsInput').value.split('\n').filter(n => n.trim());
            const regs = document.getElementById('regularsInput').value.split('\n').filter(n => n.trim());
            const n = parseInt(document.getElementById('numGroups').value);
            const grupos = Array.from({ length: n }, () => []);
            seeds.sort(() => Math.random() - 0.5); regs.sort(() => Math.random() - 0.5);
            seeds.forEach((p, i) => grupos[i % n].push({nome: p, seed: true}));
            regs.forEach((p, i) => grupos[(i + seeds.length) % n].push({nome: p, seed: false}));
            renderizarGrupos(grupos); gerarConfrontos(grupos); toggleSetup();
        }

        function renderizarGrupos(grupos) {
            const container = document.getElementById('groupsDisplay'); container.innerHTML = '';
            document.getElementById('groupsSection').style.display = 'block';
            grupos.forEach((g, idx) => {
                let html = `<div class="panel" style="padding:20px;"><h3>Grupo ${String.fromCharCode(65 + idx)}</h3><table><thead><tr><th></th><th style="text-align:left">Player</th><th>V</th><th>D</th><th>Pts</th></tr></thead><tbody id="tbody-${idx}">`;
                g.forEach(p => html += `<tr class="${p.seed?'seed-row':''}" data-player="${p.nome}"><td><button class="btn-promote" onclick="togglePromote(this, '${p.nome}')">P</button></td><td style="text-align:left">${p.nome}</td><td class="cell-v" contenteditable="true" oninput="calcPts(${idx})">0</td><td class="cell-d" contenteditable="true">0</td><td class="cell-pts" style="color:var(--accent-color)">0</td></tr>`);
                container.innerHTML += html + '</tbody></table></div>';
            });
        }

        let promovidos = [];
        function togglePromote(btn, nome) { let row = btn.closest('tr'); row.classList.toggle('promoted'); if(row.classList.contains('promoted')) promovidos.push(nome); else promovidos = promovidos.filter(n => n !== nome); }

        function calcPts(idx) {
            let rows = Array.from(document.getElementById(`tbody-${idx}`).querySelectorAll('tr'));
            rows.forEach(r => r.querySelector('.cell-pts').innerText = (parseInt(r.querySelector('.cell-v').innerText) || 0) * 3);
            rows.sort((a,b) => parseInt(b.querySelector('.cell-pts').innerText) - parseInt(a.querySelector('.cell-pts').innerText));
            rows.forEach(r => document.getElementById(`tbody-${idx}`).appendChild(r));
        }

        function gerarConfrontos(grupos) {
            let container = document.getElementById('matchesGroupsContainer'); container.innerHTML = '';
            grupos.forEach((g, idx) => {
                let html = `<div class="panel" style="margin-bottom:30px;"><h3>Grupo ${String.fromCharCode(65+idx)}</h3><div class="match-list">`;
                for(let i=0; i<g.length; i++) for(let j=i+1; j<g.length; j++) 
                    html += `<div class="match-card" data-p1="${g[i].nome}" data-p2="${g[j].nome}"><div class="match-player">${g[i].nome}<div class="god-select-btn" onclick="abrirModalDeuses(this)"></div></div><div class="match-score"><input type="number" oninput="atualizarTodosOsGods()"><span>X</span><input type="number" oninput="atualizarTodosOsGods()"></div><div class="match-player">${g[j].nome}<div class="god-select-btn" onclick="abrirModalDeuses(this)"></div></div></div>`;
                container.innerHTML += html + '</div></div>';
            });
        }

        function gerarChave(jogadores = []) {
            let size = parseInt(document.getElementById('bracketSize').value);
            let container = document.getElementById('bracketDisplay'); container.innerHTML = '';
            let rounds = Math.log2(size);
            for(let i=0; i<rounds; i++) {
                let div = document.createElement('div'); div.className = 'bracket-round';
                div.innerHTML = `<h4>${i === rounds-1 ? 'Final' : (i === rounds-2 ? 'Semi' : 'R'+(i+1))}</h4>`;
                for(let j=0; j < size / Math.pow(2, i+1); j++) {
                    let p1 = i === 0 ? (jogadores.shift() || "TBD") : "TBD";
                    let p2 = i === 0 ? (jogadores.shift() || "TBD") : "TBD";
                    div.innerHTML += `<div class="b-match" data-round="${i}" data-match="${j}"><div class="b-player"><span class="p-name" contenteditable="true">${p1}</span><input type="number" class="score-input">${i<rounds-1?`<button class="btn-advance" onclick="avancar(${i},${j},0,this)">></button>`:''}</div><div class="b-player"><span class="p-name" contenteditable="true">${p2}</span><input type="number" class="score-input">${i<rounds-1?`<button class="btn-advance" onclick="avancar(${i},${j},1,this)">></button>`:''}</div></div>`;
                }
                container.appendChild(div);
            }
        }

        function puxarPromovidos() { let copia = [...promovidos]; copia.sort(() => Math.random() - 0.5); gerarChave(copia); }

        function avancar(r, m, s, btn) {
            let match = btn.closest('.b-match'); let players = match.querySelectorAll('.b-player');
            players.forEach(p => p.classList.remove('winner-slot', 'loser-slot'));
            players[s].classList.add('winner-slot'); players[s===0?1:0].classList.add('loser-slot');
            let target = document.querySelector(`.b-match[data-round="${r+1}"][data-match="${Math.floor(m/2)}"]`);
            if(target) target.querySelectorAll('.p-name')[m%2].innerText = players[s].querySelector('.p-name').innerText;
        }

        function atualizarTodosOsGods() {
            let stats = {};
            document.querySelectorAll('.match-card').forEach(card => {
                let v1 = parseInt(card.querySelectorAll('input')[0].value) || 0;
                let v2 = parseInt(card.querySelectorAll('input')[1].value) || 0;
                let g1 = card.querySelectorAll('.god-select-btn')[0].dataset.god;
                let g2 = card.querySelectorAll('.god-select-btn')[1].dataset.god;
                if(g1) { stats[g1] = stats[g1] || {j:0, v:0}; stats[g1].j++; if(v1 > v2) stats[g1].v++; }
                if(g2) { stats[g2] = stats[g2] || {j:0, v:0}; stats[g2].j++; if(v2 > v1) stats[g2].v++; }
            });
            let tbody = document.getElementById('godsTable'); tbody.innerHTML = '';
            let sorted = Object.keys(stats).sort((a,b) => (stats[b].v/stats[b].j) - (stats[a].v/stats[a].j));
            sorted.forEach(g => {
                let wr = ((stats[g].v / stats[g].j) * 100).toFixed(1);
                tbody.innerHTML += `<tr><td style="text-align:left">${g}</td><td>${stats[g].j}</td><td>${stats[g].v}</td><td style="color:var(--accent-color)">${wr}%</td></tr>`;
            });
        }

        function saveTournament() {
            let loader = document.getElementById('saveLoader'); if(loader) loader.style.display = 'inline-block';
            document.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
            const data = {
                seeds: document.getElementById('seedsInput').value,
                regs: document.getElementById('regularsInput').value,
                n: document.getElementById('numGroups').value,
                gd: document.getElementById('groupsDisplay').innerHTML,
                gs: document.getElementById('groupsSection').style.display,
                gt: document.getElementById('godsTable').innerHTML,
                bd: document.getElementById('bracketDisplay').innerHTML,
                mc: document.getElementById('matchesGroupsContainer').innerHTML,
                pl: promovidos
            };
            db.ref('tavernas_data').set(data).then(() => { if(loader) loader.style.display = 'none'; alert("Salvo!"); });
        }

        function loadTournament() {
            db.ref('tavernas_data').once('value').then((snap) => {
                const data = snap.val(); if (!data) return gerarChave();
                document.getElementById('seedsInput').value = data.seeds;
                document.getElementById('regularsInput').value = data.regs;
                document.getElementById('numGroups').value = data.n;
                document.getElementById('groupsDisplay').innerHTML = data.gd;
                document.getElementById('groupsSection').style.display = data.gs;
                document.getElementById('godsTable').innerHTML = data.gt;
                document.getElementById('bracketDisplay').innerHTML = data.bd;
                document.getElementById('matchesGroupsContainer').innerHTML = data.mc;
                promovidos = data.pl || [];
            });
        }

        window.onload = () => { renderizarGodGrid(); loadTournament(); };
    </script>
</body>
</html>
